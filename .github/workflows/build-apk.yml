name: Build Worm Snake V2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android scaffold
        run: |
          flutter create . --platforms=android --project-name worm_snake_game --org com.murad || true
          ls -la android/ || echo "no android folder"

      - name: Generate firebase_options.dart + Google Sign-In config
        run: |
          python3 << 'PYEOF'
          import json, pathlib
          gs = pathlib.Path('google-services.json')
          if not gs.exists():
              print('NO google-services.json - leaving firebase_options.dart template')
          else:
              data = json.loads(gs.read_text())
              info = data.get('project_info', {})
              project_id = info.get('project_id', '')
              project_number = str(info.get('project_number', ''))
              storage_bucket = info.get('storage_bucket', '')
              clients = [c for c in data.get('client', [])
                         if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.murad.worm_snake_game']
              if not clients:
                  clients = data.get('client', [])
              c0 = clients[0]
              api_key = c0.get('api_key', [{}])[0].get('current_key', '')
              app_id = c0.get('client_info', {}).get('mobilesdk_app_id', '')
              web_client_id = ''
              for oc in c0.get('oauth_client', []):
                  if oc.get('client_type') == 3:
                      web_client_id = oc.get('client_id', '')
                      break
              if not web_client_id:
                  for oc in c0.get('oauth_client', []):
                      cid = oc.get('client_id', '')
                      if 'apps.googleusercontent.com' in cid:
                          web_client_id = cid
                          break
              fo = f"""// AUTO-GENERATED by GitHub Actions from google-services.json - do not edit.
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {{
            static FirebaseOptions get currentPlatform => android;

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '{api_key}',
              appId: '{app_id}',
              messagingSenderId: '{project_number}',
              projectId: '{project_id}',
              storageBucket: '{storage_bucket}',
            );

            static bool get needsSetup => android.projectId.contains('{{{{');
          }}
          """
              pathlib.Path('lib/firebase_options.dart').write_text(fo)
              print('firebase_options.dart generated for project', project_id)
              # Google Sign-In config (default_web_client_id) for the scaffold
              res_dir = pathlib.Path('android/app/src/main/res/values')
              res_dir.mkdir(parents=True, exist_ok=True)
              xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id">{web_client_id}</string>
          </resources>
          """
              (res_dir / 'google_signin_config.xml').write_text(xml)
              print('google_signin_config.xml written, web_client_id set:', bool(web_client_id))
          PYEOF

      - name: Force compileSdk 36 for every Android module
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile-sdk.gradle <<'GRADLE'
          allprojects {
            afterEvaluate { p ->
              try {
                if (p.hasProperty('android')) {
                  p.android.compileSdkVersion = 36
                }
              } catch (Exception e) {}
              try {
                if (p.hasProperty('android')) {
                  p.android.compileSdk = 36
                }
              } catch (Exception e) {}
            }
          }
          GRADLE
          cat ~/.gradle/init.d/compile-sdk.gradle

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: worm-snake-v2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
